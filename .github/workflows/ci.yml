name: Validate portfolio

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 16 * * *" # Runs at 12 mn Philippine Time every day
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # The locked Wrangler 4.135.0 release requires Node.js 22 or newer.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portfolio
        run: npm run build

      - name: Deploy to Cloudflare Workers
        # Pull requests only validate the build. Production deploys come from main.
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.135.0
          command: deploy
          # wrangler.jsonc declares this Worker binding as required.
          secrets: |
            GITHUB_TOKEN
        env:
          GITHUB_TOKEN: ${{ secrets.WORKER_GITHUB_TOKEN }}

      - name: Link production site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          echo "### Production" >> "$GITHUB_STEP_SUMMARY"
          echo "[Open the deployed portfolio](https://dreu-portfolio.francisdreu.workers.dev)" >> "$GITHUB_STEP_SUMMARY"
