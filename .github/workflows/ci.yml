name: Validate portfolio

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 16 * * *" # Runs at 12 mn Philippine Time every day
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Wrangler requires Node.js 22 or newer.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portfolio
        run: npm run build

      - name: Test Worker security controls
        run: npm run test:security

      - name: Check dependency advisories
        run: npm audit --audit-level=high

      - name: Deploy to Cloudflare Workers
        # Pull requests only validate the build. Production deploys come from main.
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Reuse the audited Wrangler installed by npm ci from package-lock.json.
          command: deploy
          # wrangler.jsonc declares this Worker binding as required.
          secrets: |
            GITHUB_TOKEN
        env:
          GITHUB_TOKEN: ${{ secrets.WORKER_GITHUB_TOKEN }}

      - name: Link production site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          echo "### Production" >> "$GITHUB_STEP_SUMMARY"
          echo "[Open the deployed portfolio](https://dreu-portfolio.francisdreu.workers.dev)" >> "$GITHUB_STEP_SUMMARY"
